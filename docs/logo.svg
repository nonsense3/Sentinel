<svg xmlns="http://www.w3.org/2000/svg" width="600" height="140" viewBox="0 0 600 140" role="img" aria-label="Sentinel">
  <rect width="600" height="140" fill="#020303"/>
  <!-- signal rail -->
  <rect x="16" y="16" width="3" height="108" fill="#38ff8e"/>
  <rect x="13" y="16" width="9" height="9" fill="#38ff8e"/>
  <rect x="13" y="115" width="9" height="9" fill="#38ff8e"/>
  <!-- signal object: plate, clipped inner frame, registration mark -->
  <rect x="40" y="22" width="96" height="96" fill="#090e0b" stroke="#304c3b"/>
  <path d="M62 44 H114 V86 L104 96 H62 Z" fill="none" stroke="#38ff8e" stroke-width="2"/>
  <rect x="48" y="30" width="10" height="10" fill="#ff65d8"/>
  <rect x="80" y="62" width="16" height="16" fill="#38ff8e"/>
  <!-- wordmark -->
  <text x="160" y="84" fill="#f8fffa" font-family="IBM Plex Sans, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">SENTINEL</text>
  <text x="162" y="110" fill="#38ff8e" font-family="IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="3">EVERY UPLOAD IS GUILTY UNTIL PROVEN CLEAN</text>
</svg>
