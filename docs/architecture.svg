<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="t d">
  <title id="t">Sentinel pipeline architecture</title>
  <desc id="d">Client calls API Gateway. POST goes to the upload Lambda, which stores the file in S3 incoming and writes a PENDING row to DynamoDB verdicts. S3 sends an ObjectCreated event to the SQS scan queue, which feeds the scanner Lambda; after 3 failed receives a message moves to the dead-letter queue. The scanner looks up hashes in DynamoDB known-hashes, writes the SCANNED row to verdicts, moves clean files to S3 clean and flagged files to S3 quarantine, and sends malicious verdicts to the SQS alerts queue, consumed by the alerts Lambda. GET goes to the status Lambda, which reads DynamoDB verdicts.</desc>

  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#659579"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff65d8"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect width="1320" height="800" fill="#020303"/>

  <!-- signal rail with section markers -->
  <rect x="28" y="28" width="3" height="744" fill="#38ff8e"/>
  <rect x="25" y="52" width="9" height="9" fill="#38ff8e"/>
  <rect x="25" y="298" width="9" height="9" fill="#38ff8e"/>
  <rect x="25" y="608" width="9" height="9" fill="#38ff8e"/>

  <!-- header -->
  <text x="70" y="64" fill="#f8fffa" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">SENTINEL — PIPELINE</text>
  <text x="70" y="90" fill="#c2cbc5" font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="12" letter-spacing="1.5">S3 · LAMBDA · SQS · DYNAMODB · API GATEWAY — RUNNING ON LOCALSTACK</text>

  <!-- ===================== boxes ===================== -->
  <g font-family="IBM Plex Mono, Consolas, Menlo, monospace" text-anchor="middle">

    <!-- Row 1 -->
    <rect x="70"  y="130" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="170" y="158" fill="#f8fffa" font-size="14" font-weight="600">CLIENT</text>
    <text x="170" y="177" fill="#c2cbc5" font-size="10.5">dashboard · demo.py</text>

    <rect x="320" y="130" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="420" y="158" fill="#f8fffa" font-size="14" font-weight="600">API GATEWAY</text>
    <text x="420" y="177" fill="#c2cbc5" font-size="10.5">/upload · /files/{id}</text>

    <rect x="570" y="130" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="670" y="158" fill="#f8fffa" font-size="14" font-weight="600">λ upload</text>
    <text x="670" y="177" fill="#c2cbc5" font-size="10.5">stores the file</text>

    <rect x="820" y="130" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="920" y="158" fill="#f8fffa" font-size="14" font-weight="600">S3 incoming</text>
    <text x="920" y="177" fill="#c2cbc5" font-size="10.5">sentinel-incoming</text>

    <!-- Row 2 -->
    <rect x="320" y="270" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="420" y="298" fill="#f8fffa" font-size="14" font-weight="600">λ status</text>
    <text x="420" y="317" fill="#c2cbc5" font-size="10.5">GET /files/{id}</text>

    <rect x="570" y="270" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="670" y="298" fill="#f8fffa" font-size="14" font-weight="600">DynamoDB verdicts</text>
    <text x="670" y="317" fill="#c2cbc5" font-size="10.5">sentinel-verdicts</text>

    <rect x="820" y="270" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="920" y="298" fill="#f8fffa" font-size="14" font-weight="600">SQS scan-queue</text>
    <text x="920" y="317" fill="#c2cbc5" font-size="10.5">sentinel-scan-queue</text>

    <rect x="1070" y="270" width="200" height="64" fill="#090e0b" stroke="#ff65d8"/>
    <text x="1170" y="298" fill="#ff65d8" font-size="14" font-weight="600">SQS scan-dlq</text>
    <text x="1170" y="317" fill="#c2cbc5" font-size="10.5">after 3 failed receives</text>

    <!-- Row 3 -->
    <rect x="820" y="410" width="200" height="84" fill="#090e0b" stroke="#38ff8e" stroke-width="1.5"/>
    <text x="920" y="440" fill="#38ff8e" font-size="14" font-weight="600">λ scanner</text>
    <text x="920" y="462" fill="#c2cbc5" font-size="10.5">hash · magic · patterns</text>
    <text x="920" y="478" fill="#c2cbc5" font-size="10.5">entropy · zip · score</text>

    <rect x="1070" y="420" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="1170" y="448" fill="#f8fffa" font-size="14" font-weight="600">DynamoDB hashes</text>
    <text x="1170" y="467" fill="#c2cbc5" font-size="10.5">sentinel-known-hashes</text>

    <!-- Row 4 -->
    <rect x="320" y="580" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="420" y="608" fill="#f8fffa" font-size="14" font-weight="600">S3 clean</text>
    <text x="420" y="627" fill="#c2cbc5" font-size="10.5">sentinel-clean</text>

    <rect x="570" y="580" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="670" y="608" fill="#f8fffa" font-size="14" font-weight="600">S3 quarantine</text>
    <text x="670" y="627" fill="#c2cbc5" font-size="10.5">sentinel-quarantine</text>

    <rect x="820" y="580" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="920" y="608" fill="#f8fffa" font-size="14" font-weight="600">SQS alerts</text>
    <text x="920" y="627" fill="#c2cbc5" font-size="10.5">sentinel-alerts</text>

    <rect x="1070" y="580" width="200" height="64" fill="#090e0b" stroke="#304c3b"/>
    <text x="1170" y="608" fill="#f8fffa" font-size="14" font-weight="600">λ alerts</text>
    <text x="1170" y="627" fill="#c2cbc5" font-size="10.5">logs SECURITY ALERT</text>
  </g>

  <!-- ===================== arrows ===================== -->
  <!-- main data / event flow -->
  <g fill="none" stroke="#659579" stroke-width="1.6">
    <!-- client → api gateway -->
    <path d="M270 162 H320" marker-end="url(#ag)"/>
    <!-- api gateway → upload (POST) -->
    <path d="M520 162 H570" marker-end="url(#ag)"/>
    <!-- upload → s3 incoming -->
    <path d="M770 162 H820" marker-end="url(#ag)"/>
    <!-- api gateway → status (GET) -->
    <path d="M420 194 V270" marker-end="url(#ag)"/>
    <!-- upload → verdicts (PENDING) -->
    <path d="M670 194 V270" marker-end="url(#ag)"/>
    <!-- s3 incoming → scan-queue (event) -->
    <path d="M920 194 V270" marker-end="url(#ag)"/>
    <!-- status → verdicts (read) -->
    <path d="M520 302 H570" marker-end="url(#ag)"/>
    <!-- scan-queue → scanner -->
    <path d="M920 334 V410" marker-end="url(#ag)"/>
    <!-- scanner → verdicts (SCANNED) -->
    <path d="M820 440 H700 V334" marker-end="url(#ag)"/>
    <!-- scanner ↔ known-hashes -->
    <path d="M1020 452 H1070" marker-start="url(#ag)" marker-end="url(#ag)"/>
    <!-- scanner → clean / quarantine (shared bus) -->
    <path d="M860 494 V537 H420 V580" marker-end="url(#ag)"/>
    <path d="M670 537 V580" marker-end="url(#ag)"/>
  </g>
  <circle cx="670" cy="537" r="3.5" fill="#659579"/>

  <!-- failure path -->
  <path d="M1020 302 H1070" fill="none" stroke="#ff65d8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>

  <!-- malicious alert path -->
  <g fill="none" stroke="#ff65d8" stroke-width="1.6">
    <path d="M920 494 V580" marker-end="url(#am)"/>
    <path d="M1020 612 H1070" marker-end="url(#am)"/>
  </g>

  <!-- ===================== arrow labels ===================== -->
  <g font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="10.5" fill="#c2cbc5">
    <text x="545" y="154" text-anchor="middle">POST</text>
    <text x="428" y="236">GET</text>
    <text x="678" y="236">PENDING</text>
    <text x="928" y="236">ObjectCreated</text>
    <text x="545" y="294" text-anchor="middle">read</text>
    <text x="928" y="376">batch of 1</text>
    <text x="760" y="432" text-anchor="middle">SCANNED</text>
    <text x="1045" y="444" text-anchor="middle">hash</text>
    <text x="428" y="565">clean</text>
    <text x="678" y="565">flagged</text>
    <text x="928" y="542" fill="#ff65d8">malicious</text>
  </g>

  <!-- ===================== legend ===================== -->
  <g font-family="IBM Plex Mono, Consolas, Menlo, monospace" font-size="11" fill="#c2cbc5">
    <line x1="70" y1="702" x2="785" y2="702" stroke="#304c3b"/>
    <path d="M70 730 H110" stroke="#659579" stroke-width="1.6" marker-end="url(#ag)"/>
    <text x="122" y="734">data / event</text>
    <path d="M250 730 H290" stroke="#ff65d8" stroke-width="1.6" marker-end="url(#am)"/>
    <text x="302" y="734">malicious → alert</text>
    <path d="M470 730 H510" stroke="#ff65d8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#am)"/>
    <text x="522" y="734">failed scan → DLQ</text>
    <text x="70" y="768">Score below 30 → clean · 30 to 79 → suspicious · 80 or more → malicious. Suspicious and malicious files are quarantined.</text>
  </g>
</svg>
